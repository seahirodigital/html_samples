(()=>{const slide=document.querySelector('.slide'),svg=document.querySelector('svg'),status=document.querySelector('.status'),revision=slide.dataset.revision||'v1',filename=slide.dataset.file,storageKey=`diagram-edit:${revision}:${filename}`,orderKey='beauty-platform:html-order:v2',modeKey='beauty-platform:toc-mode:v1',manifest=JSON.parse(document.getElementById('diagram-manifest').textContent);let selected=null,addMode=false,timer=null,saving=false,dragged=null,justMoved=false,undoStack=[];
const say=s=>{status.textContent=s}; const remember=()=>{undoStack.push(svg.innerHTML);if(undoStack.length>30)undoStack.shift()}; const undo=()=>{const previous=undoStack.pop();if(!previous){say('取り消せる変更がありません');return}svg.innerHTML=previous;assignIds();selected=null;persist();say('直前の変更を取り消しました')}; const validOrder=o=>Array.isArray(o)&&o.length===manifest.length&&new Set(o).size===manifest.length&&o.every(f=>manifest.some(m=>m.file===f)); const getOrder=()=>{try{const o=JSON.parse(localStorage.getItem(orderKey)||'[]');return validOrder(o)?o:manifest.map(m=>m.file)}catch(_){return manifest.map(m=>m.file)}}; const saveOrder=o=>localStorage.setItem(orderKey,JSON.stringify(o)); const meta=f=>manifest.find(m=>m.file===f);
const updateRoute=()=>{const order=getOrder(),pos=order.indexOf(filename),prev=order[(pos-1+order.length)%order.length],next=order[(pos+1)%order.length];const p=String(pos+1).padStart(2,'0');slide.querySelector('[rel=prev]').href=prev;slide.querySelector('[rel=next]').href=next;document.querySelectorAll('[data-page-number]').forEach(n=>n.textContent=p);document.querySelectorAll('[data-page-total]').forEach(n=>n.textContent=order.length);document.title=`${p}｜${meta(filename).title}`};
const assignIds=()=>svg.querySelectorAll('text').forEach((t,i)=>{if(!t.dataset.editId)t.dataset.editId=`text-${i}`}); const select=t=>{selected=t||null;say(t?'テキスト選択中':'自動保存ON')};
const restore=()=>{try{const saved=localStorage.getItem(storageKey);if(saved){svg.innerHTML=saved;say('自動保存を復元')}}catch(_){say('保存データ復元失敗')}assignIds()};
const cleanSource=()=>{const old=status.textContent;status.textContent='自動保存ON';const source='<!doctype html>\n'+document.documentElement.outerHTML;status.textContent=old;return source};
const saveNow=async()=>{if(saving)return;saving=true;try{localStorage.setItem(storageKey,svg.innerHTML);say('ブラウザ保存済み');const response=await fetch('http://127.0.0.1:8765/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename,source:cleanSource()})});if(!response.ok)throw new Error('save');say('元HTMLへ自動保存済み')}catch(_){say('ブラウザ保存済み｜保存サービス停止')}finally{saving=false}}; const persist=()=>{try{localStorage.setItem(storageKey,svg.innerHTML);say('自動保存待ち')}catch(_){say('ブラウザ保存失敗')}clearTimeout(timer);timer=setTimeout(saveNow,450)};
const panel=document.querySelector('.tool-panel'); const closePanel=()=>{panel.hidden=true;panel.innerHTML=''}; const pageTexts=()=>[...svg.querySelectorAll('text')];
const showLocalSearch=(preset='')=>{panel.hidden=false;panel.innerHTML='<h2>このページ内を検索</h2><input data-find placeholder="検索語" autofocus><div class="search-results"></div>';const input=panel.querySelector('[data-find]'),results=panel.querySelector('.search-results');const run=()=>{const q=input.value.trim().toLocaleLowerCase();results.innerHTML='';if(!q)return;const hits=pageTexts().filter(t=>t.textContent.toLocaleLowerCase().includes(q));if(!hits.length){results.textContent='一致なし';return}hits.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=`${i+1}. ${t.textContent.trim().slice(0,56)}`;b.onclick=()=>{select(t);say(`検索一致 ${i+1}/${hits.length}`);closePanel()};results.appendChild(b)})};input.oninput=run;input.value=preset;run();input.focus()};
const showGlobalSearch=()=>{panel.hidden=false;panel.innerHTML='<h2>全ページを検索</h2><input data-find placeholder="ページ名・キーワード" autofocus><div class="search-results"></div>';const input=panel.querySelector('[data-find]'),results=panel.querySelector('.search-results');const run=async()=>{const q=input.value.trim().toLocaleLowerCase();results.innerHTML='';if(!q)return;results.textContent='検索中…';const hits=[];for(const m of manifest){let source=m.title+' '+m.terms;if(m.file===filename){source+=' '+svg.textContent}else{try{const html=await fetch(m.file).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');source+=' '+(doc.querySelector('svg')?.textContent||doc.body.textContent||'')}catch(_){}}if(source.toLocaleLowerCase().includes(q))hits.push(m)}results.innerHTML='';if(!hits.length){results.textContent='一致なし';return}hits.forEach(m=>{const b=document.createElement('button');b.type='button';b.textContent=`${String(getOrder().indexOf(m.file)+1).padStart(2,'0')}｜${m.title}`;b.onclick=()=>location.href=`${m.file}#find=${encodeURIComponent(q)}`;results.appendChild(b)})};input.oninput=run;input.focus()};
const showReplace=()=>{panel.hidden=false;panel.innerHTML='<h2>置換範囲</h2><div style="display:flex;gap:4px;margin-bottom:8px"><button data-scope="page">このページ</button><button data-scope="all">全ページ</button></div><input data-from placeholder="検索語（空欄不可）"><input data-to placeholder="置換後の語（空欄可）"><button data-replace>置換して保存</button>';let scope='page';panel.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;panel.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));say(scope==='all'?'全ページ置換モード':'このページ置換モード')});panel.querySelector('[data-scope=page]').classList.add('active');panel.querySelector('[data-replace]').onclick=async()=>{const from=panel.querySelector('[data-from]').value,to=panel.querySelector('[data-to]').value;if(!from){say('検索語を入力してください');return}if(scope==='page'){remember();let count=0;pageTexts().forEach(t=>{if(t.textContent.includes(from)){const pieces=t.textContent.split(from);count+=pieces.length-1;t.textContent=pieces.join(to)}});if(count){select(null);persist();say(`${count}件を自動保存`)}else say('一致なし');closePanel();return}try{const response=await fetch('http://127.0.0.1:8765/replace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from,to})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'replace');say(`全ページで${result.count}件を置換して保存しました`);closePanel()}catch(_){say('全ページ置換には自動保存サービスが必要です')}};panel.querySelector('[data-from]').focus()};
const tocMode=()=>localStorage.getItem(modeKey)==='thumbs'?'thumbs':'cards'; const setTocMode=mode=>{localStorage.setItem(modeKey,mode);renderToc()}; const renderToc=()=>{const grid=document.querySelector('.toc-grid');if(!grid)return;const mode=tocMode();grid.classList.toggle('thumbnail-mode',mode==='thumbs');document.querySelectorAll('[data-toc-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.tocMode===mode);b.setAttribute('aria-pressed',b.dataset.tocMode===mode?'true':'false')});const order=getOrder();grid.innerHTML='';order.filter(f=>f!==manifest[0].file).forEach(f=>{const m=meta(f),b=document.createElement('button');b.type='button';b.className=`toc-card ${mode==='thumbs'?'thumb-card':''}`;b.draggable=true;b.dataset.file=f;b.setAttribute('aria-label',m.title);b.innerHTML=mode==='thumbs'?`<span class="toc-thumb-frame"><iframe src="${f}" title="${m.title}" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></span><span class="toc-thumb-meta"><span class="toc-no">PAGE ${String(order.indexOf(f)+1).padStart(2,'0')}</span><span class="toc-title">${m.title}</span></span><span class="toc-drag" aria-hidden="true">⠿</span>`:`<span class="toc-no">PAGE ${String(order.indexOf(f)+1).padStart(2,'0')}</span><span class="toc-title">${m.title}</span><span class="toc-drag" aria-hidden="true">⠿</span>`;b.onclick=()=>{if(!justMoved)location.href=f};b.addEventListener('dragstart',()=>{dragged=f;b.classList.add('dragging')});b.addEventListener('dragend',()=>{dragged=null;justMoved=true;b.classList.remove('dragging');setTimeout(()=>{justMoved=false},180)});b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();const target=e.currentTarget.dataset.file;if(!dragged||dragged===target)return;const next=getOrder(),from=next.indexOf(dragged),to=next.indexOf(target);next.splice(from,1);next.splice(to,0,dragged);saveOrder(next);renderToc();updateRoute()});grid.appendChild(b)})};
restore();updateRoute();renderToc();document.querySelectorAll('[data-toc-mode]').forEach(b=>b.addEventListener('click',()=>setTocMode(b.dataset.tocMode)));document.querySelector('[data-act=reset]')?.addEventListener('click',()=>{localStorage.removeItem(orderKey);renderToc();updateRoute();say('目次順を初期化')});
svg.addEventListener('click',e=>{const legend=e.target.closest('[data-legend]');if(legend){const key=legend.dataset.legend;const hidden=svg.querySelector(`[data-layer="${key}"]`)?.style.display==='none';svg.querySelectorAll(`[data-layer="${key}"]`).forEach(n=>{n.style.display=hidden?'':'none'});svg.querySelectorAll(`[data-legend="${key}"]`).forEach(n=>{n.style.opacity=hidden?'1':'.35'});say(hidden?'凡例を表示':'凡例を非表示');return}const t=e.target.closest('text');if(t){select(t);return}if(!addMode)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());const value=prompt('追加するテキストを入力');if(value){remember();const n=document.createElementNS('http://www.w3.org/2000/svg','text');n.setAttribute('x',Math.round(q.x));n.setAttribute('y',Math.round(q.y));n.setAttribute('font-size','20');n.setAttribute('fill','#202020');n.dataset.editId=`custom-${Date.now()}`;n.textContent=value;svg.appendChild(n);select(n);persist()}addMode=false;document.querySelector('[data-act=add]').classList.remove('active')});
svg.addEventListener('dblclick',e=>{const t=e.target.closest('text');if(!t)return;e.preventDefault();const value=prompt('テキストを編集。空欄で削除',t.textContent);if(value===null)return;remember();if(value===''){t.remove();select(null)}else{t.textContent=value;select(t)}persist()});
document.querySelector('[data-act=add]').onclick=e=>{addMode=!addMode;e.currentTarget.classList.toggle('active',addMode);say(addMode?'追加位置をクリック':'自動保存ON')};document.querySelector('[data-act=delete]').onclick=()=>{if(selected){remember();selected.remove();select(null);persist()}};document.querySelector('[data-act=save]').onclick=saveNow;document.querySelector('[data-act=search]').onclick=()=>showLocalSearch();document.querySelector('[data-act=global-search]').onclick=showGlobalSearch;document.querySelector('[data-act=replace]').onclick=showReplace;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();clearTimeout(timer);saveNow();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.altKey||['INPUT','BUTTON','A'].includes(e.target.tagName))return;if(e.key==='Delete'&&selected){remember();selected.remove();select(null);persist();return}const a=e.key==='ArrowLeft'?slide.querySelector('a[rel=prev]'):e.key==='ArrowRight'?slide.querySelector('a[rel=next]'):null;if(a){e.preventDefault();location.href=a.href}});const requested=new URLSearchParams(location.hash.slice(1)).get('find');if(requested)showLocalSearch(requested);slide.focus();})();
</script></body></html>
