svg.addEventListener('dblclick',e=>{const t=e.target.closest('text');if(!t)return;e.preventDefault();openEditModal(t)});
document.querySelector('[data-act=add]').onclick=e=>{addMode=!addMode;e.currentTarget.classList.toggle('active',addMode);say(addMode?'追加位置をクリック':'自動保存ON')};document.querySelector('[data-act=delete]').onclick=()=>{if(selected){remember();selected.remove();select(null);persist()}};document.querySelector('[data-act=save]').onclick=saveNow;document.querySelector('[data-act=search]').onclick=()=>showLocalSearch();document.querySelector('[data-act=global-search]').onclick=showGlobalSearch;document.querySelector('[data-act=replace]').onclick=showReplace;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!editModal.hidden){e.preventDefault();closeEditModal();return}closePanel();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();clearTimeout(timer);saveNow();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.altKey||['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(e.target.tagName))return;const toc=document.querySelector('.toc-grid');if(toc&&(e.key.toLowerCase()==='c'||e.key.toLowerCase()==='s')){e.preventDefault();setTocMode(e.key.toLowerCase()==='c'?'cards':'thumbs');say(e.key.toLowerCase()==='c'?'カード表示':'サムネイル表示');return}if(e.key==='Delete'&&selected){remember();selected.remove();select(null);persist();return}const a=e.key==='ArrowLeft'?slide.querySelector('a[rel=prev]'):e.key==='ArrowRight'?slide.querySelector('a[rel=next]'):null;if(a){e.preventDefault();location.href=a.href}});const requested=new URLSearchParams(location.hash.slice(1)).get('find');if(requested)showLocalSearch(requested);slide.focus();})();
