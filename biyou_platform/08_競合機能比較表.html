const say=s=>{status.textContent=s}; const remember=()=>{undoStack.push(svg.innerHTML);if(undoStack.length>30)undoStack.shift()}; const undo=()=>{const previous=undoStack.pop();if(!previous){say('取り消せる変更がありません');return}svg.innerHTML=previous;assignIds();selected=null;persist();say('直前の変更を取り消しました')}; const validOrder=o=>Array.isArray(o)&&o.length===manifest.length&&new Set(o).size===manifest.length&&o.every(f=>manifest.some(m=>m.file===f)); const getOrder=()=>{try{const o=JSON.parse(localStorage.getItem(orderKey)||'[]');return validOrder(o)?o:manifest.map(m=>m.file)}catch(_){return manifest.map(m=>m.file)}}; const saveOrder=o=>localStorage.setItem(orderKey,JSON.stringify(o)); const meta=f=>manifest.find(m=>m.file===f);
const updateRoute=()=>{const order=getOrder(),pos=order.indexOf(filename),prev=order[(pos-1+order.length)%order.length],next=order[(pos+1)%order.length];const p=String(pos+1).padStart(2,'0');slide.querySelector('[rel=prev]').href=prev;slide.querySelector('[rel=next]').href=next;document.querySelectorAll('[data-page-number]').forEach(n=>n.textContent=p);document.querySelectorAll('[data-page-total]').forEach(n=>n.textContent=order.length);document.title=`${p}｜${meta(filename).title}`};
const assignIds=()=>svg.querySelectorAll('text').forEach((t,i)=>{if(!t.dataset.editId)t.dataset.editId=`text-${i}`}); const select=t=>{selected=t||null;say(t?'テキスト選択中':'自動保存ON')};
const restore=()=>{assignIds();say('クラウド正本を表示中')};
const cleanSource=()=>{const root=document.documentElement.cloneNode(true);root.querySelectorAll('#codex-agent-overlay-root,[data-codex-agent-overlay-root],iframe[id^="nl-"],iframe[data-nl-ready],#nl-hud-frame').forEach(n=>n.remove());root.querySelector('.slide')?.style.removeProperty('--slide-scale');const savedStatus=root.querySelector('.status');if(savedStatus)savedStatus.textContent='自動保存ON';return '<!doctype html>\n'+root.outerHTML};
const flushSave=async()=>{let completed=false;try{while(pendingSource){const source=pendingSource;pendingSource=null;say('クラウドへ保存中');try{const response=await fetch('/api/save',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename,source})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.error||'save');completed=true;say(`GitHubへ保存済み｜公開反映中（${result.commit||'commit'}）`)}catch(_){pendingSource=source;say('クラウド保存に失敗しました｜このページを閉じず「保存」で再試行してください');return false}}return completed}finally{savingPromise=null}};const saveNow=()=>{pendingSource=cleanSource();if(!savingPromise)savingPromise=flushSave();return savingPromise};const persist=()=>{say('クラウド保存を開始');return saveNow()};const navigate=async href=>{if(!savingPromise&&!pendingSource){location.href=href;return}say('クラウド保存を確認中…');const ok=await(savingPromise||saveNow());if(ok)location.href=href};
const panel=document.querySelector('.tool-panel'); const closePanel=()=>{panel.hidden=true;panel.innerHTML=''}; const pageTexts=()=>[...svg.querySelectorAll('text')];
const editModal=document.querySelector('.edit-modal'),editInput=editModal.querySelector('[data-edit-value]');const writeSvgText=(node,value)=>{const lines=value.split('\n');if(lines.length===1){node.textContent=value;return}const x=node.getAttribute('x')||'0';node.replaceChildren();lines.forEach((line,index)=>{const span=document.createElementNS('http://www.w3.org/2000/svg','tspan');span.setAttribute('x',x);span.setAttribute('dy',index===0?'0':'1.28em');span.textContent=line;node.appendChild(span)})};const closeEditModal=()=>{editingText=null;pendingAdd=null;editModal.hidden=true;slide.focus()};const openEditModal=(target=null,addPoint=null)=>{editingText=target;pendingAdd=addPoint;editInput.value=target?target.textContent:'';editModal.hidden=false;editInput.focus();editInput.setSelectionRange(editInput.value.length,editInput.value.length)};const applyEditModal=()=>{const value=editInput.value.replace(/\r\n/g,'\n');if(!editingText&&pendingAdd){if(value){remember();const n=document.createElementNS('http://www.w3.org/2000/svg','text');n.setAttribute('x',Math.round(pendingAdd.x));n.setAttribute('y',Math.round(pendingAdd.y));n.setAttribute('font-size','20');n.setAttribute('fill','#202020');n.dataset.editId=`custom-${Date.now()}`;writeSvgText(n,value);svg.appendChild(n);select(n);persist()}closeEditModal();return}if(!editingText){closeEditModal();return}remember();if(value===''){editingText.remove();select(null)}else{writeSvgText(editingText,value);select(editingText)}persist();closeEditModal()};editModal.querySelector('[data-edit-cancel]').onclick=closeEditModal;editModal.querySelector('[data-edit-apply]').onclick=applyEditModal;editInput.addEventListener('keydown',e=>{if((e.shiftKey||e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();applyEditModal()}else if(e.key==='Escape'){e.preventDefault();closeEditModal()}});
const showLocalSearch=(preset='')=>{panel.hidden=false;panel.innerHTML='<h2>このページ内を検索</h2><input data-find placeholder="検索語" autofocus><div class="search-results"></div>';const input=panel.querySelector('[data-find]'),results=panel.querySelector('.search-results');const run=()=>{const q=input.value.trim().toLocaleLowerCase();results.innerHTML='';if(!q)return;const hits=pageTexts().filter(t=>t.textContent.toLocaleLowerCase().includes(q));if(!hits.length){results.textContent='一致なし';return}hits.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=`${i+1}. ${t.textContent.trim().slice(0,56)}`;b.onclick=()=>{select(t);say(`検索一致 ${i+1}/${hits.length}`);closePanel()};results.appendChild(b)})};input.oninput=run;input.value=preset;run();input.focus()};
const showGlobalSearch=()=>{panel.hidden=false;panel.innerHTML='<h2>全ページを検索</h2><input data-find placeholder="ページ名・キーワード" autofocus><div class="search-results"></div>';const input=panel.querySelector('[data-find]'),results=panel.querySelector('.search-results');const run=async()=>{const q=input.value.trim().toLocaleLowerCase();results.innerHTML='';if(!q)return;results.textContent='検索中…';const hits=[];for(const m of manifest){let source=m.title+' '+m.terms;if(m.file===filename){source+=' '+svg.textContent}else{try{const html=await fetch(m.file).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');source+=' '+(doc.querySelector('svg')?.textContent||doc.body.textContent||'')}catch(_){}}if(source.toLocaleLowerCase().includes(q))hits.push(m)}results.innerHTML='';if(!hits.length){results.textContent='一致なし';return}hits.forEach(m=>{const b=document.createElement('button');b.type='button';b.textContent=`${String(getOrder().indexOf(m.file)+1).padStart(2,'0')}｜${m.title}`;b.onclick=()=>navigate(`${m.file}#find=${encodeURIComponent(q)}`);results.appendChild(b)})};input.oninput=run;input.focus()};
const showReplace=()=>{panel.hidden=false;panel.innerHTML='<h2>置換範囲</h2><div style="display:flex;gap:4px;margin-bottom:8px"><button data-scope="page">このページ</button><button data-scope="all">全ページ</button></div><input data-from placeholder="検索語（空欄不可）"><input data-to placeholder="置換後の語（空欄可）"><button data-replace>置換して保存</button>';let scope='page';panel.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;panel.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));say(scope==='all'?'全ページ置換モード':'このページ置換モード')});panel.querySelector('[data-scope=page]').classList.add('active');panel.querySelector('[data-replace]').onclick=async()=>{const from=panel.querySelector('[data-from]').value,to=panel.querySelector('[data-to]').value;if(!from){say('検索語を入力してください');return}if(scope==='page'){remember();let count=0;pageTexts().forEach(t=>{if(t.textContent.includes(from)){const pieces=t.textContent.split(from);count+=pieces.length-1;t.textContent=pieces.join(to)}});if(count){select(null);persist();say(`${count}件をクラウド保存待ち`)}else say('一致なし');closePanel();return}try{const response=await fetch('/api/save',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:'replace',from,to})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'replace');say(`全ページで${result.count}件をGitHubへ保存しました`);closePanel()}catch(_){say('全ページのクラウド置換に失敗しました')}};panel.querySelector('[data-from]').focus()};
const tocMode=()=>localStorage.getItem(modeKey)==='thumbs'?'thumbs':'cards'; const setTocMode=mode=>{localStorage.setItem(modeKey,mode);renderToc()}; const renderToc=()=>{const grid=document.querySelector('.toc-grid');if(!grid)return;const mode=tocMode();grid.classList.toggle('thumbnail-mode',mode==='thumbs');document.querySelectorAll('[data-toc-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.tocMode===mode);b.setAttribute('aria-pressed',b.dataset.tocMode===mode?'true':'false')});const order=getOrder();grid.innerHTML='';order.filter(f=>f!==manifest[0].file).forEach(f=>{const m=meta(f),b=document.createElement('div');b.className=`toc-card ${mode==='thumbs'?'thumb-card':''}`;b.draggable=true;b.dataset.file=f;b.setAttribute('role','button');b.setAttribute('tabindex','0');b.setAttribute('aria-label',m.title);b.innerHTML=mode==='thumbs'?`<span class="toc-thumb-frame"><img src="${m.thumbnail}" alt="" loading="lazy" aria-hidden="true"></span><span class="toc-thumb-meta"><span class="toc-no">PAGE ${String(order.indexOf(f)+1).padStart(2,'0')}</span><span class="toc-title">${m.title}</span></span><span class="toc-drag" aria-hidden="true">⠿</span>`:`<span class="toc-no">PAGE ${String(order.indexOf(f)+1).padStart(2,'0')}</span><span class="toc-title">${m.title}</span><span class="toc-drag" aria-hidden="true">⠿</span>`;b.onclick=()=>{if(!justMoved)navigate(f)};b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navigate(f)}});b.addEventListener('dragstart',()=>{dragged=f;b.classList.add('dragging')});b.addEventListener('dragend',()=>{dragged=null;justMoved=true;b.classList.remove('dragging');setTimeout(()=>{justMoved=false},180)});b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();const target=e.currentTarget.dataset.file;if(!dragged||dragged===target)return;const next=getOrder(),from=next.indexOf(dragged),to=next.indexOf(target);next.splice(from,1);next.splice(to,0,dragged);saveOrder(next);renderToc();updateRoute()});grid.appendChild(b)})};
restore();updateRoute();renderToc();document.querySelectorAll('[data-toc-mode]').forEach(b=>b.addEventListener('click',()=>setTocMode(b.dataset.tocMode)));document.querySelector('[data-act=reset]')?.addEventListener('click',()=>{localStorage.removeItem(orderKey);renderToc();updateRoute();say('目次順を初期化')});
svg.addEventListener('click',e=>{const legend=e.target.closest('[data-legend]');if(legend){const key=legend.dataset.legend;const hidden=svg.querySelector(`[data-layer="${key}"]`)?.style.display==='none';svg.querySelectorAll(`[data-layer="${key}"]`).forEach(n=>{n.style.display=hidden?'':'none'});svg.querySelectorAll(`[data-legend="${key}"]`).forEach(n=>{n.style.opacity=hidden?'1':'.35'});say(hidden?'凡例を表示':'凡例を非表示');return}const t=e.target.closest('text');if(t){select(t);return}if(!addMode)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());addMode=false;document.querySelector('[data-act=add]').classList.remove('active');openEditModal(null,q)});
svg.addEventListener('dblclick',e=>{const t=e.target.closest('text');if(!t)return;e.preventDefault();openEditModal(t)});
document.querySelector('[data-act=add]').onclick=e=>{addMode=!addMode;e.currentTarget.classList.toggle('active',addMode);say(addMode?'追加位置をクリック':'自動保存ON')};document.querySelector('[data-act=delete]').onclick=()=>{if(selected){remember();selected.remove();select(null);persist()}};document.querySelector('[data-act=save]').onclick=saveNow;document.querySelector('[data-act=search]').onclick=()=>showLocalSearch();document.querySelector('[data-act=global-search]').onclick=showGlobalSearch;document.querySelector('[data-act=replace]').onclick=showReplace;
document.addEventListener('click',e=>{const a=e.target.closest('.nav a');if(!a||(!savingPromise&&!pendingSource))return;e.preventDefault();navigate(a.href)},true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!editModal.hidden){e.preventDefault();closeEditModal();return}closePanel();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.altKey||['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(e.target.tagName))return;const toc=document.querySelector('.toc-grid');if(toc&&(e.key.toLowerCase()==='c'||e.key.toLowerCase()==='s')){e.preventDefault();setTocMode(e.key.toLowerCase()==='c'?'cards':'thumbs');say(e.key.toLowerCase()==='c'?'カード表示':'サムネイル表示');return}if(e.key==='Delete'&&selected){remember();selected.remove();select(null);persist();return}const a=e.key==='ArrowLeft'?slide.querySelector('a[rel=prev]'):e.key==='ArrowRight'?slide.querySelector('a[rel=next]'):null;if(a){e.preventDefault();navigate(a.href)}});const requested=new URLSearchParams(location.hash.slice(1)).get('find');if(requested)showLocalSearch(requested);slide.focus();})();
</script></body></html>
