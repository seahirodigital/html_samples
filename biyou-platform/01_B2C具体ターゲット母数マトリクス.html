torage.getItem(modeKey)==='thumbs'?'thumbs':'cards'; const setTocMode=mode=>{localStorage.setItem(modeKey,mode);renderToc()}; const renderToc=()=>{const grid=document.querySelector('.toc-grid');if(!grid)return;const mode=tocMode();grid.classList.toggle('thumbnail-mode',mode==='thumbs');document.querySelectorAll('[data-toc-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.tocMode===mode);b.setAttribute('aria-pressed',b.dataset.tocMode===mode?'true':'false')});const order=getOrder();grid.innerHTML='';order.filter(f=>f!==manifest[0].file).forEach(f=>{const m=meta(f),b=document.createElement('div');b.className=`toc-card ${mode==='thumbs'?'thumb-card':''}`;b.draggable=true;b.dataset.file=f;b.setAttribute('role','button');b.setAttribute('tabindex','0');b.setAttribute('aria-label',m.title);b.innerHTML=mode==='thumbs'?`<span class="toc-thumb-frame"><img src="${m.thumbnail}" alt="" loading="lazy" aria-hidden="true"></span><span class="toc-thumb-meta"><span class="toc-no">PAGE ${String(order.indexOf(f)+1).padStart(2,'0')}</span><span class="toc-title">${m.title}</span></span><span class="toc-drag" aria-hidden="true">⠿</span>`:`<span class="toc-no">PAGE ${String(order.indexOf(f)+1).padStart(2,'0')}</span><span class="toc-title">${m.title}</span><span class="toc-drag" aria-hidden="true">⠿</span>`;b.onclick=()=>{if(!justMoved)navigate(f)};b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navigate(f)}});b.addEventListener('dragstart',()=>{dragged=f;b.classList.add('dragging')});b.addEventListener('dragend',()=>{dragged=null;justMoved=true;b.classList.remove('dragging');setTimeout(()=>{justMoved=false},180)});b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();const target=e.currentTarget.dataset.file;if(!dragged||dragged===target)return;const next=getOrder(),from=next.indexOf(dragged),to=next.indexOf(target);next.splice(from,1);next.splice(to,0,dragged);saveOrder(next);renderToc();updateRoute()});grid.appendChild(b)})};

</script><script>
(()=>{
  const root=document.documentElement;
  const body=document.body;
  const slide=document.querySelector('.slide');
  const buttons=[...document.querySelectorAll('[data-act="fullscreen"]')];
  if(!slide||!buttons.length)return;
  const hint=document.createElement('div');
  hint.className='rotate-hint';
  hint.textContent='端末を横向きにしてご覧ください';
  body.appendChild(hint);
  const isActive=()=>Boolean(document.fullscreenElement)||slide.classList.contains('fullscreen-active');
  const setMode=active=>{
    body.classList.toggle('fullscreen-mode',active);
    slide.classList.toggle('fullscreen-active',active);
    buttons.forEach(button=>{
      button.textContent=active?'通常表示':'横向きフルビュー';
      button.setAttribute('aria-label',active?'通常表示へ戻す':'横向きフルビューで表示');
      button.setAttribute('title',active?'通常表示へ戻す':'横向きフルビューで表示');
    });
    window.dispatchEvent(new Event('resize'));
  };
  const lockLandscape=async()=>{
    try{await screen.orientation?.lock?.('landscape')}catch(_){}
  };
  const unlockOrientation=()=>{try{screen.orientation?.unlock?.()}catch(_){}};
  const exit=async()=>{
    unlockOrientation();
    if(document.fullscreenElement&&document.exitFullscreen){
      try{await document.exitFullscreen()}catch(_){setMode(false)}
    }else setMode(false);
  };
  const enter=async()=>{
    try{
      if(root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'});
    }catch(_){}
    await lockLandscape();
    setMode(true);
  };
  buttons.forEach(button=>button.addEventListener('click',()=>isActive()?exit():enter()));
  document.addEventListener('fullscreenchange',()=>setMode(Boolean(document.fullscreenElement)));
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&isActive()&&!document.querySelector('.edit-modal:not([hidden])')){
      event.preventDefault();exit();
    }
  });
  slide.addEventListener('pointerup',event=>{
    if(!isActive()||!['touch','pen'].includes(event.pointerType))return;
    if(event.target.closest('button,a,input,textarea,[contenteditable]'))return;
    const rect=slide.getBoundingClientRect();
    const x=event.clientX-rect.left;
    const link=x<=rect.width/3?slide.querySelector('a[rel="prev"]'):x>=rect.width*2/3?slide.querySelector('a[rel="next"]'):null;
    if(link){event.preventDefault();link.click()}
  },{passive:false});
})();
</script></body></html>
