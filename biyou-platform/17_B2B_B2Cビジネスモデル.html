(()=>{
  const root=document.documentElement;

      button.setAttribute('title',active?'通常表示へ戻す':'横向きフルビューで表示');
    });

  };

    try{await screen.orientation?.lock?.('landscape')}catch(_){}
  };
  const unlockOrientation=()=>{try{screen.orientation?.unlock?.()}catch(_){}};
  const exit=async()=>{
    unlockOrientation();

      try{await document.exitFullscreen()}catch(_){setMode(false)}

  };
  const enter=async()=>{

  };

  document.addEventListener('fullscreenchange',()=>setMode(Boolean(document.fullscreenElement)));
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&isActive()&&!document.querySelector('.edit-modal:not([hidden])')){
      event.preventDefault();exit();
