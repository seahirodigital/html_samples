/* スマホ／タブレット用フルビュー */

(()=>{
  const root=document.documentElement;
  const body=document.body;
  const slide=document.querySelector('.slide');
  const buttons=[...document.querySelectorAll('[data-act="fullscreen"]')];
  if(!slide||!buttons.length)return;
  const hint=document.createElement('div');
  hint.className='rotate-hint';
  hint.textContent='端末を横向きにしてご覧ください';
  body.appendChild(hint);
  const isActive=()=>Boolean(document.fullscreenElement)||slide.classList.contains('fullscreen-active');
  const setMode=active=>{
    body.classList.toggle('fullscreen-mode',active);
    slide.classList.toggle('fullscreen-active',active);
    buttons.forEach(button=>{
      button.textContent=active?'通常表示':'横向きフルビュー';
      button.setAttribute('aria-label',active?'通常表示へ戻す':'横向きフルビューで表示');
      button.setAttribute('title',active?'通常表示へ戻す':'横向きフルビューで表示');
    });
    window.dispatchEvent(new Event('resize'));
  };
  const lockLandscape=async()=>{
    try{await screen.orientation?.lock?.('landscape')}catch(_){}
  };
  const unlockOrientation=()=>{try{screen.orientation?.unlock?.()}catch(_){}};
  const exit=async()=>{
    unlockOrientation();
    if(document.fullscreenElement&&document.exitFullscreen){
      try{await document.exitFullscreen()}catch(_){setMode(false)}
    }else setMode(false);
  };
  const enter=async()=>{
    try{
      if(root.requestFullscreen)await root.requestFullscreen({navigationUI:'hide'});
    }catch(_){}
    await lockLandscape();
    setMode(true);
  };
  buttons.forEach(button=>button.addEventListener('click',()=>isActive()?exit():enter()));
  document.addEventListener('fullscreenchange',()=>setMode(Boolean(document.fullscreenElement)));
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&isActive()&&!document.querySelector('.edit-modal:not([hidden])')){
      event.preventDefault();exit();
    }
  });
  slide.addEventListener('pointerup',event=>{
    if(!isActive()||!['touch','pen'].includes(event.pointerType))return;
    if(event.target.closest('button,a,input,textarea,[contenteditable]'))return;
    const rect=slide.getBoundingClientRect();
    const x=event.clientX-rect.left;
    const link=x<=rect.width/3?slide.querySelector('a[rel="prev"]'):x>=rect.width*2/3?slide.querySelector('a[rel="next"]'):null;
    if(link){event.preventDefault();link.click()}
  },{passive:false});
})();
</script>
<script data-responsive-runtime>
(()=>{

  const slide=document.querySelector('.slide');
  const svg=slide?.querySelector('svg');
  if(!slide||!svg)return;
  const filename=slide.dataset.file||'';
  const isIndex=filename==='00_図解ナビゲーション.html';
  const mobile=()=>matchMedia('(max-width:767px)').matches;
  const getMode=()=>localStorage.getItem(responsiveKey)==='responsive'?'responsive':'slide';
  const setMode=mode=>{localStorage.setItem(responsiveKey,mode);applyMode()};
  const textOf=node=>(node?.textContent||'').replace(/\s+/g,' ').trim();
  const number=v=>Number.parseFloat(v||'0')||0;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const textNodes=()=>[...svg.querySelectorAll('text')].map((node,i)=>({node,i,text:textOf(node),x:number(node.getAttribute('x')),y:number(node.getAttribute('y')),size:number(node.getAttribute('font-size'))||12})).filter(x=>x.text);
  const header=()=>{
    const nodes=textNodes().filter(x=>x.y<180).sort((a,b)=>a.y-b.y||a.x-b.x);
    const title=nodes.filter(x=>x.size>=22).map(x=>x.text)[0]||textOf(svg.querySelector('title'))||'図解';
    const subs=nodes.filter(x=>x.text!==title&&x.size<22).map(x=>x.text).filter(Boolean).slice(0,2);
    return {title,subtitle:subs.join('　')};
  };
  const responsiveKind=()=>{
    const rectCount=svg.querySelectorAll('rect').length;
    const textCount=textNodes().length;
    if(rectCount>=55||textCount>=70)return 'table';
    if(/マトリクス|象限|セグメント|ターゲット優先/.test(header().title))return 'plot';
    return 'flow';
  };
  const rectCards=()=>{
    const rects=[...svg.querySelectorAll('rect')].map((node,i)=>({node,i,x:number(node.getAttribute('x')),y:number(node.getAttribute('y')),w:number(node.getAttribute('width')),h:number(node.getAttribute('height'))}));

      if(r.y<170||r.w<100||r.h<36||r.w>1500||r.h>330)continue;
      const inside=texts.filter(t=>t.x>=r.x-4&&t.x<=r.x+r.w+4&&t.y>=r.y-4&&t.y<=r.y+r.h+8);

      const key=c.inside.map(t=>t.text).join('|');
      if(!unique.some(u=>u.key===key))unique.push({...c,key});
    }
    return unique.slice(0,24);
  };
  const fallbackGroups=()=>{
    const groups=[];
    for(const item of textNodes().filter(t=>t.y>=175&&t.size>=10).sort((a,b)=>a.y-b.y||a.x-b.x)){

  };
  const cardNode=(items,index)=>{

  const cloneSvg=()=>{

  const renderBoard=()=>{

      const note=document.createElement('p');note.className='responsive-scroll-note';note.textContent=kind==='table'?'比較表・詳細データは横にスワイプして確認できます。':'原図は横にスワイプして拡大表示できます。';section.appendChild(note);

  };
